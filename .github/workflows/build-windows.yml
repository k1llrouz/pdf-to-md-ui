name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 3.12 rather than the newest release: PySide6 and opendataloader-pdf
      # both have prebuilt wheels for it, so no toolchain is needed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Needed for jlink, not for running the app.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # The installer takes its version from the tag, About from version.py:
      # refuse a tag that does not match, so the two can never disagree.
      - name: Check the tag matches version.py
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (python -c "from version import __version__; print(__version__)").Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match version.py ($version)."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      # Before anything is built: the suite covers the batch loop, settings,
      # and the converter's real output - including a page of 3000 strokes in
      # 128 MB, so a release that brings back veraPDF's line-art memory
      # problem never ships.
      # A release (a v* tag) also needs every language translated in full;
      # in between, only English and Russian have to keep up.
      - name: Run tests
        env:
          RELEASE_CHECK: ${{ github.ref_type == 'tag' && '1' || '' }}
        run: python -m pytest tests -q

      # zip-6 rather than the older --compress=2, which JDK 21 deprecates.
      # jdk.unsupported carries sun.misc.Unsafe, which PDFBox needs to release
      # memory-mapped files; without it every image-bearing PDF logs
      # "SEVERE: Unmapping is not supported".
      - name: Build trimmed JRE
        run: |
          jlink --add-modules java.base,java.desktop,java.logging,java.naming,java.xml,jdk.unsupported `
                --strip-debug --no-header-files --no-man-pages --compress=zip-6 `
                --output jre
          jre\bin\java.exe -version

      - name: Build application
        run: pyinstaller --noconfirm app.spec

      # The installer ships one folder, and the app looks for the runtime next
      # to its executable — same layout build.bat produces locally.
      - name: Place the JRE next to the executable
        run: Copy-Item -Recurse -Force jre "dist\PDF to Markdown\jre"

      # Look for the backend jar by name: the bundled JRE always contributes a
      # jrt-fs.jar, so "any .jar exists" would pass even on a broken bundle.
      - name: Verify the backend jar was bundled
        shell: pwsh
        run: |
          $jars = Get-ChildItem -Path "dist" -Recurse -Filter "opendataloader-pdf*.jar"
          if ($jars.Count -eq 0) {
            Write-Error "opendataloader-pdf jar missing from dist/ - collect_all did not pick up the backend."
          }
          $jars | ForEach-Object { Write-Host $_.FullName }

      # The hidden-text switch (patches/README.md): without it "Drop hidden
      # text" quietly leaves invisible and white-on-white text in.
      - name: Verify the hidden-text patch was bundled
        shell: pwsh
        run: |
          $patch = Get-ChildItem -Path "dist" -Recurse -Filter "FilterConfig.class" |
                   Where-Object { $_.FullName -like "*patches*hidden-text*" }
          if (-not $patch) {
            Write-Error "patches/hidden-text missing from dist/ - check the datas entry in app.spec."
          }
          $patch | ForEach-Object { Write-Host $_.FullName }

      # Inno Setup ships with the windows runner image, but it is not on PATH
      # and the location has moved between image versions.
      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe",
                                "C:\Program Files\Inno Setup*\ISCC.exe" `
                                -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          "path=$($iscc.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: |
          & "${{ steps.inno.outputs.path }}" /DAppVersion="${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}" installer.iss

      - uses: actions/upload-artifact@v7
        with:
          name: PDF-to-Markdown-Setup
          path: Output/*.exe
          retention-days: 30

      - name: Attach installer to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: Output/*.exe
